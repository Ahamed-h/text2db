<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 800px;
        }
        .header {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px 12px 0 0;
        }
        .header h1 { 
            margin: 0;
            font-size: 24px;
        }
        .header p {
            margin: 5px 0 0 0;
            font-size: 13px;
            opacity: 0.9;
        }
        .info-bar {
            padding: 8px 20px;
            background: #f9f9f9;
            font-size: 12px;
            color: #666;
            border-bottom: 1px solid #e0e0e0;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            display: flex;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .user-msg {
            justify-content: flex-end;
        }
        .user-msg .bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px 12px 0 12px;
            max-width: 70%;
            padding: 12px 15px;
            word-wrap: break-word;
        }
        .assistant-msg .bubble {
            background: #f0f4ff;
            color: #333;
            border-radius: 12px 12px 12px 0;
            border-left: 3px solid #667eea;
            max-width: 85%;
            padding: 12px 15px;
            line-height: 1.5;
        }
        .assistant-msg .meta {
            font-size: 11px;
            color: #999;
            margin-top: 5px;
            margin-left: 10px;
        }
        .sql-badge {
            display: inline-block;
            background: #e3f2fd;
            color: #1976d2;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 8px;
        }
        .result-count {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 8px;
        }
        .error-msg {
            background: #f8d7da;
            color: #721c24;
            border-left: 3px solid #dc3545;
        }
        .input-section {
            padding: 15px 20px;
            border-top: 1px solid #e0e0e0;
            background: #fafafa;
            border-radius: 0 0 12px 12px;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        input { 
            flex: 1;
            padding: 12px 15px;
            font-size: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button { 
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        button:hover { 
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .loading {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }
        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }
        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
            40% { transform: translateY(-8px); opacity: 1; }
        }
        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px 20px;
        }
        .empty-state h2 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 18px;
        }
        .empty-state p {
            font-size: 14px;
            margin-bottom: 20px;
        }
        .example-queries {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        .example-btn {
            background: white;
            border: 2px solid #e0e0e0;
            color: #667eea;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .example-btn:hover {
            background: #f5f5f5;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{{ title }}</h1>
            <p>{{ subtitle }}</p>
        </div>
        
        <div class="info-bar">
            📊 <strong>{{ db_name }}</strong> | 🤖 <strong>{{ llm_model }}</strong>
        </div>
        
        <div class="messages" id="messages">
            <div class="empty-state">
                <h2>Welcome to text2db</h2>
                <p>Ask natural language questions about your database</p>
                <div class="example-queries">
                    <button class="example-btn" onclick="askQuestion('How many movies are there?')">📊 Movie Count</button>
                    <button class="example-btn" onclick="askQuestion('Show me movies from 2020')">🎬 Movies by Year</button>
                    <button class="example-btn" onclick="askQuestion('What are the top rated movies?')">⭐ Top Rated</button>
                    <button class="example-btn" onclick="askQuestion('Count comments by month')">💬 Comments Stats</button>
                </div>
            </div>
        </div>
        
        <div class="input-section">
            <div class="input-group">
                <input 
                    type="text" 
                    id="question" 
                    placeholder="{{ placeholder }}"
                    autocomplete="off"
                />
                <button id="sendBtn" onclick="askQuestion()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const messagesDiv = document.getElementById('messages');
        const questionInput = document.getElementById('question');
        const sendBtn = document.getElementById('sendBtn');
        let isLoading = false;

        async function askQuestion(msg = null) {
            const question = msg || questionInput.value.trim();
            if (!question || isLoading) return;

            if (!msg) questionInput.value = '';
            isLoading = true;
            sendBtn.disabled = true;

            // Clear empty state
            if (messagesDiv.querySelector('.empty-state')) {
                messagesDiv.innerHTML = '';
            }

            // Add user message
            addMessage('user', question);

            // Show loading
            const loadingId = addMessage('assistant', '<div class="loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>');

            try {
                const response = await fetch('/api/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question })
                });

                const data = await response.json();

                if (!response.ok || data.error) {
                    throw new Error(data.error || `HTTP ${response.status}`);
                }

                // Remove loading message
                document.getElementById(loadingId).remove();

                // Add assistant response
                const answerText = data.text || "No answer returned.";
                const count = data.json?.count || 0;
                const sqlQuery = data.json?.sql_query || '';

                let messageHTML = `<div>${answerText}</div>`;
                if (count > 0) {
                    messageHTML += `<span class="result-count">📊 ${count} result${count !== 1 ? 's' : ''}</span>`;
                }
                if (sqlQuery) {
                    messageHTML += `<span class="sql-badge" title="${escapeHtml(sqlQuery)}">SQL</span>`;
                }

                addMessage('assistant', messageHTML);

            } catch (error) {
                document.getElementById(loadingId).remove();
                addMessage('assistant', `<div class="error-msg">❌ ${escapeHtml(error.message)}</div>`, true);
            } finally {
                isLoading = false;
                sendBtn.disabled = false;
                questionInput.focus();
            }
        }

        function addMessage(role, content, isError = false) {
            const id = 'msg-' + Date.now();
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}-msg`;
            msgDiv.id = id;

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = content;

            msgDiv.appendChild(bubble);

            if (role === 'assistant') {
                const meta = document.createElement('div');
                meta.className = 'meta';
                meta.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                msgDiv.appendChild(meta);
            }

            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            return id;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        questionInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !isLoading) askQuestion();
        });

        questionInput.focus();
    </script>
</body>
</html>
