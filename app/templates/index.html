<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
        .container{background:#fff;border-radius:12px;box-shadow:0 10px 40px #0003;max-width:900px;width:100%;display:flex;flex-direction:column;height:90vh;max-height:800px}
        .header{padding:20px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-radius:12px 12px 0 0}
        .header h1{font-size:24px}.header p{margin-top:5px;font-size:13px;opacity:.9}
        .info-bar{padding:8px 20px;background:#f9f9f9;font-size:12px;color:#666;border-bottom:1px solid #e0e0e0}
        .messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:15px}
        .message{display:flex;gap:10px;animation:slideIn .3s ease}
        @keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .user-msg{justify-content:flex-end}
        .user-msg .bubble{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-radius:12px 12px 0 12px;max-width:70%;padding:12px 15px;word-wrap:break-word}
        .assistant-msg .bubble{background:#f0f4ff;color:#333;border-radius:12px 12px 12px 0;border-left:3px solid #667eea;max-width:85%;padding:12px 15px;line-height:1.5}
        .meta{font-size:11px;color:#999;margin:5px 0 0 10px}
        .result-count{display:inline-block;background:#667eea;color:#fff;padding:2px 8px;border-radius:3px;font-size:11px;font-weight:600;margin-left:8px}
        .error-msg{background:#f8d7da;color:#721c24;border-left:3px solid #dc3545}
        .input-section{padding:15px 20px;border-top:1px solid #e0e0e0;background:#fafafa;border-radius:0 0 12px 12px}
        .input-group{display:flex;gap:10px}
        input{flex:1;padding:12px 15px;font-size:14px;border:2px solid #e0e0e0;border-radius:6px;font-family:inherit}
        input:focus{outline:none;border-color:#667eea}
        button{padding:12px 25px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:0;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600}
        button:disabled{opacity:.6;cursor:not-allowed}
        .loading{display:flex;gap:6px;align-items:center}
        .dot{width:8px;height:8px;background:#667eea;border-radius:50%;animation:bounce 1.4s infinite}
        .dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
        @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-8px);opacity:1}}
        .empty-state{text-align:center;color:#999;padding:40px 20px}
        .empty-state h2{color:#667eea;margin-bottom:10px;font-size:18px}
        .empty-state p{font-size:14px;margin-bottom:20px}
        .example-queries{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
        .example-btn{background:#fff;border:2px solid #e0e0e0;color:#667eea;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:12px}
    </style>
</head>

<body>
<div class="container">

    <div class="header">
        <h1>{{ title }}</h1>
        <p>{{ subtitle }}</p>
    </div>

    <div class="info-bar">
        📊 <strong>{{ db_name }}</strong> | 🤖 <strong>{{ llm_model }}</strong>
    </div>

    <div class="messages" id="messages">
        <div class="empty-state">
            <h2>Welcome to text2db</h2>
            <p>Ask natural language questions about your database</p>

            <div class="example-queries">
                <button class="example-btn"
                    onclick="askQuestion('How many movies are there?')">
                    Movie Count
                </button>

                <button class="example-btn"
                    onclick="askQuestion('Show me movies from 2020')">
                    Movies by Year
                </button>

                <button class="example-btn"
                    onclick="askQuestion('Show me movies with Tom Hanks')">
                    Movies by Actor
                </button>

                <button class="example-btn"
                    onclick="askQuestion('Show horror movies')">
                    Horror Movies
                </button>
            </div>
        </div>
    </div>

    <div class="input-section">
        <div class="input-group">
            <input id="question"
                   type="text"
                   placeholder="{{ placeholder }}"
                   autocomplete="off">
            <button id="sendBtn" onclick="askQuestion()">Send</button>
        </div>
    </div>

</div>

<script>
const messagesDiv=document.getElementById('messages');
const questionInput=document.getElementById('question');
const sendBtn=document.getElementById('sendBtn');
let isLoading=false;

async function askQuestion(msg=null){
    const question=msg||questionInput.value.trim();
    if(!question||isLoading)return;

    if(!msg)questionInput.value='';
    isLoading=true;
    sendBtn.disabled=true;

    if(messagesDiv.querySelector('.empty-state'))
        messagesDiv.innerHTML='';

    addMessage('user',escapeHtml(question));

    const loadingId=addMessage(
        'assistant',
        '<div class="loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>'
    );

    try{
        const response=await fetch('/api/query',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({question})
        });

        const data=await response.json();

        if(!response.ok)
            throw new Error(data.error||`HTTP ${response.status}`);

        document.getElementById(loadingId).remove();

        const answer=escapeHtml(data.text||'No answer returned.');
        const count=data.json?.count||0;

        let html=`<div>${answer}</div>`;

        if(count>0)
            html+=`<span class="result-count">${count} result${count!==1?'s':''}</span>`;

        addMessage('assistant',html);

    }catch(error){
        document.getElementById(loadingId)?.remove();
        addMessage(
            'assistant',
            `<div class="error-msg">${escapeHtml(error.message)}</div>`
        );
    }finally{
        isLoading=false;
        sendBtn.disabled=false;
        questionInput.focus();
    }
}

function addMessage(role,content){
    const id='msg-'+Date.now();
    const msg=document.createElement('div');

    msg.className=`message ${role}-msg`;
    msg.id=id;

    const bubble=document.createElement('div');
    bubble.className='bubble';
    bubble.innerHTML=content;

    msg.appendChild(bubble);

    if(role==='assistant'){
        const meta=document.createElement('div');
        meta.className='meta';
        meta.textContent=new Date().toLocaleTimeString([],{
            hour:'2-digit',
            minute:'2-digit'
        });
        msg.appendChild(meta);
    }

    messagesDiv.appendChild(msg);
    messagesDiv.scrollTop=messagesDiv.scrollHeight;

    return id;
}

function escapeHtml(text){
    const div=document.createElement('div');
    div.textContent=text;
    return div.innerHTML;
}

questionInput.addEventListener('keypress',e=>{
    if(e.key==='Enter'&&!isLoading)askQuestion();
});

questionInput.focus();
</script>
</body>
</html>
